# ------------------------------------------------------------------------
# General Settings - 3090 x 4 GPU Configuration
# ------------------------------------------------------------------------
name: train_sonarsr_det_x8_3090  # 3090 4GPU 학습
model_type: sr4ir_det

# WandB Logging
wandb:
  project: SR4IR
  run_name: sonarsr4ir_3090_4gpu
  mode: online

scale: 8                    # ★ SonarSR 원본 가중치와 동일 (8배)
num_gpu: 4                  # 3090 4대
manual_seed: 1023
num_threads: 16
print_freq: 100
dist_url: env://
find_unused_parameters: true

# ------------------------------------------------------------------------
# Dataset Settings
# ------------------------------------------------------------------------
data:
  path: /mnt/server16_hard1/LIGNEX1/yolo_data/combined/train/images
  format: custom
  is_voc: false
  crop_size: 640
  yolo_normalized: true
  merge_classes: false
  label_offset: 1

# ------------------------------------------------------------------------
# Network Settings
# ------------------------------------------------------------------------
network_sr:
  name: sonarsr
  scale: 8
  in_channels: 1
  base_channels: 64
  num_residual_blocks: 8

network_det:
  name: SonarFasterRCNNDetector
  use_1ch: true                  # ★ 순수 1채널 detector
  backbone_variant: large
  num_classes: 3
  image_mean: [0.449]
  image_std: [0.226]

# ------------------------------------------------------------------------
# Path Settings (Pretrained weights)
# ------------------------------------------------------------------------
path:
  network_sr: /mnt/server16_hard0/kangwook/LIGNex1/SonarSR/checkpoints/sr_arch_pixelshuffle_globalo_v2/model_step_100000.pth
  network_sr_key: generator_state_dict
  strict_load: false
  network_det: /mnt/server16_hard1/LIGNEX1/SR4IR/runs_det_pure1ch_pretrained/best_map.pth

# ------------------------------------------------------------------------
# Training Settings - 3090 4GPU (배치 1, effective batch = 1*4*8 = 32)
# ------------------------------------------------------------------------
train:
  batch_size: 1             # Per GPU batch size (3090 24GB)
  accumulation_steps: 8     # Effective batch = 1 * 4 * 8 = 32 (원본과 동일)
  epoch: 50
  save_freq: 5
  sr_save_prob: 0.001
  warmup_epoch: 0
  eval_freq: 1

  # Optimizer (원본과 동일)
  optim_sr:
    type: AdamW
    lr: !!float 5e-5
    weight_decay: 0
    betas: [0.9, 0.999]

  optim_det:
    type: SGD
    lr: !!float 1e-3
    momentum: 0.9
    weight_decay: !!float 1e-4

  # Scheduler (원본과 동일)
  scheduler_sr:
    type: CosineAnnealingLR
    T_max: 50
    eta_min: 0
  scheduler_det:
    type: CosineAnnealingLR
    T_max: 50
    eta_min: 0

  # ★ Phase 1 Loss (SR 학습용) - 원본과 동일
  pixel_opt:
    type: L1Loss
    loss_weight: !!float 1.0

  pixel_dn_opt:
    type: L1Loss
    loss_weight: !!float 0.5

  tdp_opt:
    type: MultiScaleObjectAwareTDPLoss
    loss_weight: !!float 0.3
    criterion: l1
    layer_weights:
      '0': 1.0
      '1': 0.5
      'pool': 0.2
    object_weight: !!float 3.0
    background_weight: !!float 1.0
    spatial_sigma: !!float 1.5

  # ★ Phase 2 Loss (디텍터 적응용) - 원본과 동일
  det_hr_opt:
    type: DETLoss
    loss_weight: !!float 1.0

  det_sr_opt:
    type: DETLoss
    loss_weight: !!float 1.0

  det_cqmix_opt:
    type: DETLoss
    loss_weight: !!float 1.0

  det_loss_clip: 2.0
  det_grad_clip: 0.5
  learnable_noise: false
  noise_min_L: 0.05
  noise_max_L: 0.5

test:
  calculate_lpips: false
  sr_save_prob: 0.01

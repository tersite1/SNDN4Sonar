# ------------------------------------------------------------------------
# General Settings
# ------------------------------------------------------------------------
name: train_sonarsr_det_x8  # 실험 이름 (SonarSR 사용, scale x8 원래대로)
model_type: sr4ir_det

# WandB Logging
wandb:
  project: SR4IR
  run_name: new_sonarsr4ir
  mode: online  # online: 클라우드 동기화, offline: 로컬 저장
  api_key: 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
scale: 8                    # ★ SonarSR 원본 가중치와 동일 (8배)
num_gpu: 4                  # GPU 4대 사용 (0,1,2,3)
manual_seed: 1023
num_threads: 16
print_freq: 100  # unit: iter
dist_url: env://
find_unused_parameters: true  # DDP에서 BatchNorm 파라미터 허용

# ------------------------------------------------------------------------
# Dataset Settings
# ------------------------------------------------------------------------
data:
  path: /mnt/server16_hard1/LIGNEX1/yolo_data/combined/train/images # ★ 소나 패치 데이터 경로
  format: custom           # 데이터 로더 포맷 (src/data/det.py에 맞춰야 함)
  is_voc: false            # VOC 데이터셋 아님
  crop_size: 640           # ★ 디텍터 입력 크기와 일치 (640 → LR: 80x80, scale=8)
  yolo_normalized: true    # YOLO 정규화 좌표 (cx, cy, w, h in 0~1)
  merge_classes: false     # ★ 3-class: Class 0→1 (cylinder), Class 1→2 (manta)
  label_offset: 1          # Class ID에 1을 더함 (background=0이므로)
  # 데이터 로더 설정 (필요시 src/data/det.py 수정 필요)
  # 사용자님의 train_det_low.py에서 쓴 데이터셋 방식을 여기에 연결해야 함

# ------------------------------------------------------------------------
# Network Settings
# ------------------------------------------------------------------------
# [학생] SR/Denoise 모델
network_sr:
  name: sonarsr            # ★ Original SonarSR architecture
  scale: 8                 # ★ FIXED: 원본은 8배만 지원
  in_channels: 1           # ★ Grayscale (Pretrained와 동일)
  base_channels: 64        # Pretrained weight와 동일하게 유지
  num_residual_blocks: 8   # 원본과 동일
  # NOTE: 나머지 파라미터는 원본 구조에서 고정됨 (attention=True, bilinear upsample)

# [선생님] 기뢰 탐지 디텍터
network_det:
  name: SonarFasterRCNNDetector  # arch 파일명 매칭용
  use_1ch: true                  # ★ 순수 1채널 detector 사용 (SonarFasterRCNNDetector1ch)
  backbone_variant: large
  num_classes: 3                 # 배경 + cylinder + manta (총 3개 클래스)
  image_mean: [0.449]            # ImageNet grayscale mean
  image_std: [0.226]             # ImageNet grayscale std

# ------------------------------------------------------------------------
# Resume Training (CRITICAL: top-level key, not under 'path')
# ------------------------------------------------------------------------
# resume: null  # 처음부터 학습

# ------------------------------------------------------------------------
# Path Settings (가중치 연결) - ★ Resume 시에도 필요 (load_network 함수에서 체크)
# ------------------------------------------------------------------------
path:
  # [학생 초기값] SonarSR Pre-trained 모델 - resume 시에는 사용 안 함 (checkpoint에서 로드)
  network_sr: /mnt/server16_hard0/kangwook/LIGNex1/SonarSR/checkpoints/sr_arch_pixelshuffle_globalo_v2/model_step_100000.pth
  network_sr_key: generator_state_dict  # ★ SonarSR checkpoint 구조에 맞춤
  strict_load: false
  # [선생님 초기값] - resume 시에는 사용 안 함 (checkpoint에서 로드)
  # ★ 순수 1채널 pretrained detector (mAP 0.725)
  network_det: /mnt/server16_hard1/LIGNEX1/SR4IR/runs_det_pure1ch_pretrained/best_map.pth

# ------------------------------------------------------------------------
# Training Settings
# ------------------------------------------------------------------------
train:
  batch_size: 1       # Per-GPU batch size (OOM 방지)
  accumulation_steps: 8  # Gradient accumulation (effective batch = 1 * 4 GPU * 8 = 32)
  epoch: 50           # 충분히 학습
  save_freq: 5        # 5 에포크마다 저장
  sr_save_prob: 0.001 # SR 샘플 이미지 저장 확률 (0.1% = 1000장당 1장)
  warmup_epoch: 0     # TDP loss 처음부터 사용
  eval_freq: 1        # 5 에포크마다 검증 (학습 속도 향상)
  
  # Optimizer
  optim_sr:
    type: AdamW
    lr: !!float 5e-5  # 학습률 낮춤 (아티팩트 감소, pretrained 모델 유지)
    weight_decay: 0
    betas: [0.9, 0.999]

  optim_det:
    type: SGD
    lr: !!float 1e-3  # Pretrained detector 보호 (1e-2 → 1e-3, 10배 감소)
    momentum: 0.9
    weight_decay: !!float 1e-4

  # Scheduler
  scheduler_sr:
    type: CosineAnnealingLR
    T_max: 50
    eta_min: 0
  scheduler_det:
    type: CosineAnnealingLR
    T_max: 50
    eta_min: 0

  # ★ Phase 1 Loss (SR 학습용)
  pixel_opt:
    type: L1Loss
    loss_weight: !!float 1.0  # Pixel quality 기본 확보

  # SonarSR denoised LR에 대한 pixel loss (중간 supervision)
  pixel_dn_opt:
    type: L1Loss
    loss_weight: !!float 0.5  # Denoised LR supervision (보조적)

  tdp_opt:
    type: MultiScaleObjectAwareTDPLoss  # ★ Multi-Scale + Object-Aware TDP
    loss_weight: !!float 0.3  # ★ TDP weight 낮춤 (안정성)
    criterion: l1
    # Multi-scale FPN features (MobileNetV3-FPN outputs: '0', '1', 'pool')
    layer_weights:
      '0': 1.0    # FPN level 0 (stride 32, 20x20) - primary feature
      '1': 0.5    # FPN level 1 (stride 32, 20x20) - additional context
      'pool': 0.2 # Pooled feature (stride 64, 10x10) - global context
    # Object-aware spatial weighting parameters
    object_weight: !!float 3.0      # ★ 5.0→3.0 (gradient 폭발 방지)
    background_weight: !!float 1.0  # Base weight for background
    spatial_sigma: !!float 1.5      # Gaussian smoothing sigma

  # ★ Phase 2 Loss (디텍터 적응용)
  # HR: 원본 성능 유지 (catastrophic forgetting 방지)
  # SR: SR 도메인 적응
  # CQMix: HR+SR 혼합 (일반화)

  det_hr_opt:
    type: DETLoss
    loss_weight: !!float 1.0  # ★ HR 성능 유지 (forgetting 방지)

  det_sr_opt:
    type: DETLoss
    loss_weight: !!float 1.0  # SR 도메인 적응

  det_cqmix_opt:
    type: DETLoss
    loss_weight: !!float 1.0  # 혼합 이미지

  det_loss_clip: 2.0    # ★ 스파이크 상한 줄임 (5.0 → 2.0)
  det_grad_clip: 0.5    # ★ gradient 진동 감소 (1.0 → 0.5)
  learnable_noise: false
  noise_min_L: 0.05  # ★ SonarSR 원본 학습 config와 동일
  noise_max_L: 0.5   # ★ SonarSR 원본 학습 config와 동일



test:
  calculate_lpips: false
  sr_save_prob: 0.01  # Validation 시 SR 샘플 저장 확률 (1%)
